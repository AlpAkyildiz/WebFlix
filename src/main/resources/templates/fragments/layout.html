<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | WebFlix'">WebFlix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-3">
    <div class="container">
        <a class="navbar-brand brand-logo fs-4" th:href="@{/}">WEBFLIX</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <!-- Sadece oturum açmış kullanıcılara görünen site menüsü -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" th:if="${session.currentUser != null}">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Ana Sayfa</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/kesfet(tur='FILM')}">Filmler</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/kesfet(tur='DIZI')}">Diziler</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/listem}">İzleme Listem</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/oner}">İçerik Öner</a>
                </li>
                <li class="nav-item" th:if="${session.currentUser.role == 'ADMIN'}">
                    <a class="nav-link text-warning fw-bold" th:href="@{/admin}">&#9881; Yönetim Paneli</a>
                </li>
            </ul>

            <form class="d-flex me-3 mb-2 mb-lg-0" th:if="${session.currentUser != null}"
                  th:action="@{/kesfet}" method="get">
                <input class="form-control form-control-sm form-control-dark me-2" type="search"
                       name="q" placeholder="Film veya dizi ara...">
                <button class="btn btn-sm btn-outline-light" type="submit">Ara</button>
            </form>

            <!-- Oturum Açmamış Kullanıcı Butonları -->
            <div class="d-flex gap-2 ms-auto" th:if="${session.currentUser == null}">
                <a th:href="@{/giris}" class="btn btn-sm btn-outline-light">Giriş Yap</a>
                <a th:href="@{/kayit}" class="btn btn-sm btn-cine">Kayıt Ol</a>
            </div>

            <!-- Oturum Açmış Kullanıcı / Admin Menüsü -->
            <div class="d-flex align-items-center gap-2" th:if="${session.currentUser != null}">
                <a th:href="@{/hesabim}" class="btn btn-sm btn-dark border-secondary text-light">
                    <span th:text="${session.currentUser.fullName}">Kullanıcı</span>
                    <span class="badge ms-1"
                          th:classappend="${session.currentUser.role == 'ADMIN'} ? 'bg-warning text-dark' : 'bg-secondary'"
                          th:text="${session.currentUser.role}">USER</span>
                </a>
                <a th:href="@{/cikis}" class="btn btn-sm btn-outline-danger">Çıkış</a>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="py-4 mt-5 border-top border-secondary text-secondary text-center">
    <div class="container">
        <p class="mb-1 text-light fw-semibold">WEBFLIX</p>
        <small>&copy; 2026 WebFlix - Spring Boot &amp; Thymeleaf Film/Dizi Kataloğu</small>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</footer>

</body>
</html>
