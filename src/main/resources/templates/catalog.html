<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Keşfet')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container my-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <div>
            <h1 class="h3 fw-bold mb-1">Katalog</h1>
            <p class="text-secondary mb-0" th:text="${#lists.size(contents)} + ' yapım listeleniyor'">8 yapım</p>
        </div>

        <!-- Filtreleme Formu -->
        <form th:action="@{/kesfet}" method="get" class="row g-2">
            <div class="col-auto">
                <select name="tur" class="form-select form-select-dark">
                    <option value="">Tüm Formatlar</option>
                    <option value="FILM" th:selected="${seciliTur == 'FILM'}">Filmler</option>
                    <option value="DIZI" th:selected="${seciliTur == 'DIZI'}">Diziler</option>
                </select>
            </div>
            <div class="col-auto">
                <select name="kategori" class="form-select form-select-dark">
                    <option value="">Tüm Türler</option>
                    <option th:each="g : ${genres}" th:value="${g}" th:text="${g}"
                            th:selected="${seciliKategori == g}">Tür</option>
                </select>
            </div>
            <div class="col-auto">
                <input type="text" name="q" th:value="${aramaMetni}"
                       class="form-control form-control-dark" placeholder="İsim ara...">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-cine">Filtrele</button>
                <a th:href="@{/kesfet}" class="btn btn-outline-secondary">Sıfırla</a>
            </div>
        </form>
    </div>

    <!-- Boş Sonuç Uyarısı -->
    <div th:if="${#lists.isEmpty(contents)}" class="text-center py-5 border border-secondary rounded-3">
        <h4 class="text-secondary">Aradığınız kriterlere uygun yapım bulunamadı.</h4>
        <a th:href="@{/kesfet}" class="btn btn-cine mt-3">Tüm Yapımları Göster</a>
    </div>

    <!-- Sonuç Kartları -->
    <div class="row g-4" th:unless="${#lists.isEmpty(contents)}">
        <div class="col-6 col-md-3" th:each="item : ${contents}">
            <div class="media-card h-100 d-flex flex-column">
                <div class="poster-wrapper">
                    <span class="badge type-badge"
                          th:classappend="${item.type == 'FILM'} ? 'bg-danger' : 'bg-primary'"
                          th:text="${item.type == 'FILM'} ? 'FİLM' : 'DİZİ'">FİLM</span>
                    <span class="rating-badge" th:text="'★ ' + ${item.rating}">★ 8.8</span>
                    <img th:src="@{${item.posterUrl}}" th:alt="${item.title}"
                         onerror="this.onerror=null;this.src='https://placehold.co/400x600/18181b/e50914?text=' + encodeURIComponent(this.alt);">
                </div>
                <div class="p-3 d-flex flex-column flex-grow-1">
                    <small class="text-secondary mb-1"
                           th:text="${item.genre} + ' • ' + ${item.releaseYear} + ' • ' + ${item.duration}">Bilgi</small>
                    <h2 class="h6 fw-bold mb-2" th:text="${item.title}">Başlık</h2>
                    <p class="small text-secondary mb-3" th:text="'Yönetmen: ' + ${item.director}">Yönetmen</p>
                    <div class="mt-auto d-flex gap-2">
                        <a th:href="@{/icerik/{id}(id=${item.id})}" class="btn btn-cine btn-sm flex-grow-1">İncele</a>
                        <form th:action="@{/listem/toggle/{id}(id=${item.id})}" method="post">
                            <button type="submit" class="btn btn-outline-secondary btn-sm"
                                    th:text="${watchlistIds.contains(item.id)} ? '✓' : '+'">+</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
