<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${formTitle})}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 fw-bold mb-0" th:text="${formTitle}">Yeni Yapım Ekle</h1>
                <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">&larr; Panele Dön</a>
            </div>

            <form th:action="@{/admin/kaydet}" th:object="${content}" method="post"
                  class="p-4 p-md-5 rounded-4 border border-secondary" style="background-color: #14161d;">

                <!-- Güncelleme işlemi için gizli ID alanı -->
                <input type="hidden" th:field="*{id}">

                <div class="row g-3 mb-3">
                    <div class="col-md-8">
                        <label class="form-label">Yapım Adı *</label>
                        <input type="text" th:field="*{title}" class="form-control form-control-dark" required
                               placeholder="Örn: The Matrix">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Format *</label>
                        <select th:field="*{type}" class="form-select form-select-dark" required>
                            <option value="FILM">Film</option>
                            <option value="DIZI">Dizi</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Tür / Kategori *</label>
                        <input type="text" th:field="*{genre}" class="form-control form-control-dark" required
                               placeholder="Örn: Bilim Kurgu">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Çıkış Yılı *</label>
                        <input type="number" th:field="*{releaseYear}" class="form-control form-control-dark" required
                               min="1900" max="2030" placeholder="2024">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">IMDb Puanı (1-10) *</label>
                        <input type="number" step="0.1" min="1" max="10" th:field="*{rating}"
                               class="form-control form-control-dark" required placeholder="8.5">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Süre / Sezon Bilgisi *</label>
                        <input type="text" th:field="*{duration}" class="form-control form-control-dark" required
                               placeholder="Örn: 2s 16dk veya 3 Sezon">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Yönetmen / Yaratıcı *</label>
                        <input type="text" th:field="*{director}" class="form-control form-control-dark" required
                               placeholder="Örn: Lana Wachowski">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Oyuncular (Virgülle ayırarak yazın)</label>
                    <input type="text" name="castCsv" th:value="${content.castAsString}"
                           class="form-control form-control-dark"
                           placeholder="Keanu Reeves, Laurence Fishburne, Carrie-Anne Moss">
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Afiş Görsel URL (İsteğe Bağlı)</label>
                        <input type="text" th:field="*{posterUrl}" class="form-control form-control-dark"
                               placeholder="/images/matrix.jpg (Boş bırakılırsa otomatik afiş atanır)">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">YouTube Embed Fragman URL (İsteğe Bağlı)</label>
                        <input type="text" th:field="*{trailerUrl}" class="form-control form-control-dark"
                               placeholder="https://www.youtube.com/embed/...">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Yapım Özeti *</label>
                    <textarea th:field="*{summary}" rows="4" class="form-control form-control-dark" required
                              placeholder="Film veya dizinin konusunu kısaca özetleyin..."></textarea>
                </div>

                <div class="d-flex gap-3">
                    <button type="submit" class="btn btn-cine px-5 py-2">Kaydet</button>
                    <a th:href="@{/admin}" class="btn btn-outline-secondary px-4 py-2">İptal</a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
